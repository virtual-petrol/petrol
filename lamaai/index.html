<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lama Ai</title>

<style>
body {
  font-family: Arial;
  background: #0f172a;
  color: white;
  display: flex;
  justify-content: center;
  margin-top: 50px;
}

.container {
  width: 420px;
  text-align: center;
}

textarea {
  width: 100%;
  height: 120px;
  padding: 10px;
  margin-bottom: 10px;
  border-radius: 8px;
  border: none;
}

button {
  padding: 10px 20px;
  background: #22c55e;
  border: none;
  color: white;
  cursor: pointer;
  border-radius: 8px;
}

#output {
  margin-top: 20px;
  background: #1e293b;
  padding: 15px;
  border-radius: 8px;
  min-height: 100px;
  text-align: left;
  white-space: pre-wrap;
}
</style>
</head>

<body>

<div class="container">
  <h1>Lama Ai</h1>

  <textarea id="prompt" placeholder="Type something..."></textarea>

  <button onclick="generate()">Generate</button>

  <div id="output">Output will appear here...</div>
</div>

<script>
async function generate() {
  const prompt = document.getElementById("prompt").value;
  const output = document.getElementById("output");

  if (!prompt) {
    output.innerText = "Please enter a prompt!";
    return;
  }

  output.innerText = "Generating...";

  try {
    const response = await fetch(
      "https://api-inference.huggingface.co/models/mistralai/Mistral-7B-Instruct-v0.2",
      {
        method: "POST",
        headers: {
          "Authorization": "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",
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          inputs: prompt
        })
      }
    );

    const data = await response.json();

    if (data.error) {
      output.innerText = "Error: " + data.error;
    } else {
      output.innerText = data[0].generated_text;
    }

  } catch (error) {
    output.innerText = "Request failed!";
  }
}
</script>

</body>
</html>
