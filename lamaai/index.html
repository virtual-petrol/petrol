<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lama AI</title>
<style>
body {
  background: #0f172a;
  color: white;
  font-family: Arial;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.container {
  width: 400px;
}

textarea {
  width: 100%;
  height: 100px;
  padding: 10px;
  border-radius: 10px;
  border: none;
}

button {
  margin-top: 10px;
  width: 100%;
  padding: 10px;
  border: none;
  background: #22c55e;
  color: black;
  font-weight: bold;
  border-radius: 10px;
  cursor: pointer;
}

.output {
  margin-top: 15px;
  background: #1e293b;
  padding: 10px;
  border-radius: 10px;
}
</style>
</head>

<body>

<div class="container">
  <h2>Lama AI</h2>

  <textarea id="input" placeholder="Ask something..."></textarea>
  <button onclick="generate()">Generate</button>

  <div class="output" id="output">Response will appear here...</div>
</div>

<script>
async function generate() {
  const input = document.getElementById("input").value;
  const output = document.getElementById("output");

  output.innerText = "Thinking...";

  try {
    const res = await fetch("http://localhost:3000/api/generate", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        inputs: input
      })
    });

    const data = await res.json();

    output.innerText = data[0]?.generated_text || "No response";
  } catch (err) {
    output.innerText = "Error: " + err.message;
  }
}
</script>

</body>
</html>
