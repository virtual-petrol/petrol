<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Gesture Particles</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        /* UI Overlay */
        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 10px;
            backdrop-filter: blur(5px);
            pointer-events: none;
            border: 1px solid rgba(255,255,255,0.2);
        }

        h1 { margin: 0 0 10px 0; font-size: 18px; color: #00d2ff; }
        p { margin: 5px 0; font-size: 14px; }
        .highlight { color: #ff0055; font-weight: bold; }

        #status-display {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.8);
            pointer-events: none;
            text-align: center;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            pointer-events: none;
            transition: opacity 0.5s;
        }

        #input_video { display: none; }
    </style>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- MediaPipe Hands -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="loading">Loading AI & 3D Engine...</div>
    
    <video id="input_video"></video>

    <div id="canvas-container"></div>

    <div id="info-panel">
        <h1>Gesture Controls</h1>
        <p>✌️ <b>Peace Sign</b> → ❤️ Heart</p>
        <p>✊ <b>Fist</b> → 🪐 Saturn</p>
        <p>👆 <b>Point (1 Finger)</b> → Letter A</p>
        <p>🤟 <b>Three Fingers</b> → 🎆 Firework</p>
        <p>🖐️ <b>Open Palm</b> → 🌺 Flower</p>
        <p>🤏 <b>Pinch</b> → Expand & Color Shift</p>
    </div>

    <div id="status-display">Show Hand to Start</div>

    <script>
        // --- 1. CONFIGURATION & STATE ---
        const PARTICLE_COUNT = 6000;
        const PARTICLE_SIZE = 0.15;
        let currentShape = 'heart';
        let handData = null; // Stores hand x, y, pinch strength
        let detectedGesture = 'None';
        let stableGesture = 'None'; // To prevent flickering
        let gestureStabilityCounter = 0; // Frames to confirm gesture
        const GESTURE_THRESHOLD = 8; // Must hold for 8 frames
        
        // --- 2. THREE.JS SETUP ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.002);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 30;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // --- 3. PARTICLE SYSTEM ---
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(PARTICLE_COUNT * 3);
        const targetPositions = new Float32Array(PARTICLE_COUNT * 3);
        const colors = new Float32Array(PARTICLE_COUNT * 3);
        
        // Initial random positions
        for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
            positions[i] = (Math.random() - 0.5) * 100;
            colors[i] = Math.random();
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const sprite = new THREE.TextureLoader().load('https://threejs.org/examples/textures/sprites/spark1.png');

        const material = new THREE.PointsMaterial({
            size: PARTICLE_SIZE,
            map: sprite,
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            depthTest: false,
            transparent: true,
            opacity: 0.8
        });

        const particles = new THREE.Points(geometry, material);
        scene.add(particles);

        // --- 4. SHAPE GENERATORS ---

        function getPointsFromText(text, count) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 200;
            canvas.height = 200;
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, 200, 200);
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 160px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, 100, 100);

            const imageData = ctx.getImageData(0, 0, 200, 200);
            const data = imageData.data;
            const validPoints = [];

            for (let y = 0; y < 200; y += 2) {
                for (let x = 0; x < 200; x += 2) {
                    const index = (y * 200 + x) * 4;
                    if (data[index] > 128) { 
                        validPoints.push({
                            x: (x - 100) * 0.15,
                            y: -(y - 100) * 0.15,
                            z: (Math.random() - 0.5) * 2
                        });
                    }
                }
            }
            
            while (validPoints.length < count) {
                validPoints.push({
                    x: (Math.random() - 0.5) * 30,
                    y: (Math.random() - 0.5) * 30,
                    z: (Math.random() - 0.5) * 10
                });
            }
            return validPoints;
        }

        function getHeartPoints(count) {
            const arr = [];
            for (let i = 0; i < count; i++) {
                let t = Math.random() * Math.PI * 2;
                let r = Math.sqrt(Math.random()); 
                let x = 16 * Math.pow(Math.sin(t), 3);
                let y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
                let z = (Math.random() - 0.5) * 5 * r; 
                x *= 0.5 * r;
                y *= 0.5 * r;
                arr.push({x, y, z});
            }
            return arr;
        }

        function getSaturnPoints(count) {
            const arr = [];
            for(let i=0; i < count * 0.6; i++) {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                const r = 6 + Math.random() * 0.5;
                arr.push({
                    x: r * Math.sin(phi) * Math.cos(theta),
                    y: r * Math.sin(phi) * Math.sin(theta),
                    z: r * Math.cos(phi)
                });
            }
            for(let i=0; i < count * 0.4; i++) {
                const theta = Math.random() * Math.PI * 2;
                const dist = 8 + Math.random() * 4; 
                arr.push({
                    x: dist * Math.cos(theta),
                    y: (Math.random() - 0.5) * 0.5, 
                    z: dist * Math.sin(theta)
                });
            }
            return arr;
        }

        function getFlowerPoints(count) {
            const arr = [];
            for (let i = 0; i < count; i++) {
                const r = Math.random() * 10;
                const theta = Math.random() * Math.PI * 2;
                const k = 5; 
                const radius = 10 * Math.cos(k * theta) + 2; 
                arr.push({
                    x: radius * Math.cos(theta),
                    y: radius * Math.sin(theta),
                    z: (Math.random() - 0.5) * 2
                });
            }
            return arr;
        }

        function getFireworkPoints(count) {
            const arr = [];
            for (let i = 0; i < count; i++) {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                const r = 10 + Math.random() * 10; 
                const v = 0.2; 
                arr.push({
                    x: (Math.random() - 0.5) * 2, 
                    y: (Math.random() - 0.5) * 2,
                    z: (Math.random() - 0.5) * 2,
                    vx: Math.sin(phi) * Math.cos(theta) * v,
                    vy: Math.sin(phi) * Math.sin(theta) * v,
                    vz: Math.cos(phi) * v,
                    life: Math.random() 
                });
            }
            return arr;
        }

        function setTargetPositions(shapeName) {
            currentShape = shapeName;
            let points = [];

            if (shapeName === 'heart') points = getHeartPoints(PARTICLE_COUNT);
            else if (shapeName === 'saturn') points = getSaturnPoints(PARTICLE_COUNT);
            else if (shapeName === 'a') points = getPointsFromText('A', PARTICLE_COUNT);
            else if (shapeName === 'flower') points = getFlowerPoints(PARTICLE_COUNT);
            else if (shapeName === 'firework') points = getFireworkPoints(PARTICLE_COUNT);

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                targetPositions[i * 3] = points[i].x;
                targetPositions[i * 3 + 1] = points[i].y;
                targetPositions[i * 3 + 2] = points[i].z || 0;
            }
        }

        // Initialize
        setTargetPositions('flower'); // Start with flower

        // --- 5. GESTURE RECOGNITION LOGIC ---
        function detectGesture(landmarks) {
            // Helper to check if finger is extended (Tip is above PIP joint in Y)
            // Note: Y increases downwards in screen coords, so Tip Y < Joint Y means UP
            const isIndexExtended = landmarks[8].y < landmarks[6].y;
            const isMiddleExtended = landmarks[12].y < landmarks[10].y;
            const isRingExtended = landmarks[16].y < landmarks[14].y;
            const isPinkyExtended = landmarks[20].y < landmarks[18].y;
            
            // Thumb is tricky (moves on X), using distance to index MCP (5) or Wrist (0)
            // Simple approximation: Is Thumb tip far from Pinky MCP (17)?
            const thumbTip = landmarks[4];
            const pinkyMcp = landmarks[17];
            const isThumbOpen = Math.abs(thumbTip.x - pinkyMcp.x) > 0.1;

            let extendedCount = isIndexExtended + isMiddleExtended + isRingExtended + isPinkyExtended;

            // Logic Tree
            if (extendedCount === 0 && !isThumbOpen) return 'Fist'; // Saturn
            if (extendedCount === 1 && isIndexExtended) return 'Point'; // A
            if (extendedCount === 2 && isIndexExtended && isMiddleExtended) return 'Peace'; // Heart
            if (extendedCount === 3) return 'Three'; // Firework
            if (extendedCount >= 4) return 'Open'; // Flower
            
            return 'Unknown';
        }

        function processHandGestures(landmarks) {
            const gesture = detectGesture(landmarks);
            detectedGesture = gesture;

            // Debounce/Smoothing: Only switch if held for N frames
            if (gesture === stableGesture) {
                gestureStabilityCounter++;
            } else {
                gestureStabilityCounter = 0;
                stableGesture = gesture; // Reset tracking
            }

            // Switch shape if stable
            if (gestureStabilityCounter > GESTURE_THRESHOLD) {
                let targetShape = 'flower'; // Default
                let label = "Open Palm";

                switch(gesture) {
                    case 'Fist': targetShape = 'saturn'; label = "Saturn (Fist)"; break;
                    case 'Point': targetShape = 'a'; label = "Letter A (Point)"; break;
                    case 'Peace': targetShape = 'heart'; label = "Heart (Peace)"; break;
                    case 'Three': targetShape = 'firework'; label = "Firework (3 Fingers)"; break;
                    case 'Open': targetShape = 'flower'; label = "Flower (Palm)"; break;
                }

                if (currentShape !== targetShape) {
                    setTargetPositions(targetShape);
                }
                
                document.getElementById('status-display').innerText = label;
            }
        }

        // --- 6. ANIMATION LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();
            const positionsAttribute = geometry.attributes.position;
            const colorsAttribute = geometry.attributes.color;

            let pinchStrength = handData ? handData.pinch : 0; 
            let handX = handData ? handData.x : 0;
            let handY = handData ? handData.y : 0;

            // Rotation based on hand position
            particles.rotation.y += 0.002 + (handX * 0.05);
            particles.rotation.x += (handY * 0.05);

            let expansion = 1 + (pinchStrength * 4); 
            
            const r = 0.2 + (pinchStrength * 0.8);
            const g = 0.5 - (pinchStrength * 0.3);
            const b = 1.0 - (pinchStrength * 1.0);

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const ix = i * 3;
                const iy = i * 3 + 1;
                const iz = i * 3 + 2;

                let tx = targetPositions[ix];
                let ty = targetPositions[iy];
                let tz = targetPositions[iz];

                if (currentShape === 'firework') {
                    tx += Math.sin(time * 2 + i) * 0.5;
                    ty += Math.cos(time * 3 + i) * 0.5;
                    tz += Math.sin(time + i) * 0.5;
                }

                tx *= expansion;
                ty *= expansion;
                tz *= expansion;

                const speed = 0.05;
                positions[ix] += (tx - positions[ix]) * speed;
                positions[iy] += (ty - positions[iy]) * speed;
                positions[iz] += (tz - positions[iz]) * speed;

                positions[ix] += Math.sin(time * 5 + i) * 0.02;
                positions[iy] += Math.cos(time * 5 + i) * 0.02;

                colorsAttribute.array[ix] = r + (Math.random() * 0.2);
                colorsAttribute.array[iy] = g + (Math.random() * 0.2);
                colorsAttribute.array[iz] = b + (Math.random() * 0.2);
            }

            positionsAttribute.needsUpdate = true;
            colorsAttribute.needsUpdate = true;

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- 7. MEDIAPIPE HANDS SETUP ---
        const videoElement = document.getElementById('input_video');
        
        function onResults(results) {
            document.getElementById('loading').style.opacity = 0;
            
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                
                // 1. Process Shape Gestures
                processHandGestures(landmarks);

                // 2. Process Pinch & Position
                const thumb = landmarks[4];
                const index = landmarks[8];
                const distance = Math.sqrt(Math.pow(thumb.x - index.x, 2) + Math.pow(thumb.y - index.y, 2));
                let pinch = 1 - (distance * 5); 
                if (pinch < 0) pinch = 0;
                if (pinch > 1) pinch = 1;

                if (!handData) handData = { x: 0, y: 0, pinch: 0 };
                handData.pinch += (pinch - handData.pinch) * 0.1;
                
                const targetX = (landmarks[9].x - 0.5) * 2; 
                const targetY = (landmarks[9].y - 0.5) * 2;
                handData.x += (targetX - handData.x) * 0.1;
                handData.y += (targetY - handData.y) * 0.1;

            } else {
                if (handData) {
                    handData.pinch *= 0.9;
                    handData.x *= 0.95;
                    handData.y *= 0.95;
                }
                document.getElementById('status-display').innerText = "No Hand Detected";
                gestureStabilityCounter = 0; // Reset stability
            }
        }

        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        hands.onResults(onResults);

        const cameraUtils = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 640,
            height: 480
        });

        cameraUtils.start()
            .then(() => { console.log("Camera started"); })
            .catch(err => {
                console.error("Camera error:", err);
                document.getElementById('loading').innerText = "Camera access denied.";
            });

    </script>
</body>
</html>
