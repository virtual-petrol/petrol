<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Lama AI Pro | Advanced Voice Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* --- DESIGN SYSTEM & VARIABLES --- */
      :root {
        /* Palette: Deep Space & Neon */
        --bg-deep: #050507;
        --bg-surface: rgba(20, 20, 25, 0.6);
        --bg-glass: rgba(255, 255, 255, 0.03);
        --border-glass: rgba(255, 255, 255, 0.08);
        
        /* Accents */
        --primary: #00f2ff; /* Cyan */
        --primary-dim: rgba(0, 242, 255, 0.15);
        --secondary: #bd00ff; /* Purple */
        --success: #00ff9d;
        
        /* Typography */
        --font-main: 'Inter', sans-serif;
        --font-display: 'Space Grotesk', sans-serif;

        /* Spacing & Radius */
        --radius-lg: 24px;
        --radius-md: 16px;
        --radius-sm: 8px;
        --radius-pill: 999px;

        /* Shadows */
        --glow-primary: 0 0 20px rgba(0, 242, 255, 0.3);
        --shadow-card: 0 8px 32px 0 rgba(0, 0, 0, 0.36);
      }

      /* --- RESET & BASE --- */
      * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
      
      body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-deep);
        color: #ffffff;
        font-family: var(--font-main);
        height: 100vh;
        overflow: hidden; /* App-like feel */
        display: flex;
        flex-direction: column;
      }

      /* Ambient Background */
      body::before {
        content: '';
        position: absolute;
        top: -20%; left: -10%; width: 60%; height: 60%;
        background: radial-gradient(circle, rgba(189,0,255,0.15), transparent 70%);
        filter: blur(80px);
        z-index: -1;
        animation: drift 20s infinite alternate;
      }
      body::after {
        content: '';
        position: absolute;
        bottom: -20%; right: -10%; width: 60%; height: 60%;
        background: radial-gradient(circle, rgba(0,242,255,0.1), transparent 70%);
        filter: blur(80px);
        z-index: -1;
        animation: drift 25s infinite alternate-reverse;
      }

      @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(50px, 50px); } }

      /* --- LAYOUT --- */
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 24px;
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--border-glass);
        z-index: 10;
      }

      .brand {
        font-family: var(--font-display);
        font-size: 1.25rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        background: linear-gradient(90deg, #fff, var(--primary));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .status-pill {
        font-size: 0.75rem;
        padding: 6px 12px;
        border-radius: var(--radius-pill);
        background: var(--bg-glass);
        border: 1px solid var(--border-glass);
        display: flex;
        align-items: center;
        gap: 6px;
        color: rgba(255,255,255,0.6);
        transition: all 0.3s ease;
      }
      .status-dot {
        width: 6px; height: 6px;
        border-radius: 50%;
        background-color: var(--success);
        box-shadow: 0 0 8px var(--success);
      }
      .status-dot.listening { background-color: var(--primary); box-shadow: 0 0 8px var(--primary); animation: pulse 1s infinite; }
      .status-dot.processing { background-color: var(--secondary); box-shadow: 0 0 8px var(--secondary); animation: pulse 0.5s infinite; }

      /* --- MAIN STAGE --- */
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        padding: 20px;
        overflow: hidden;
      }

      /* --- THE ORB (Visualizer) --- */
      .orb-container {
        position: relative;
        width: 160px;
        height: 160px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 40px;
      }

      .orb {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #fff, var(--primary) 40%, #0051ff 100%);
        box-shadow: 0 0 40px var(--primary-dim);
        position: relative;
        z-index: 2;
        transition: all 0.2s ease-out;
        will-change: transform;
      }

      /* Rings */
      .ring {
        position: absolute;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.1);
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        z-index: 1;
      }
      .ring-1 { width: 120px; height: 120px; border-color: rgba(0, 242, 255, 0.2); animation: spin 8s linear infinite; }
      .ring-2 { width: 180px; height: 180px; border-color: rgba(189, 0, 255, 0.15); animation: spin-rev 12s linear infinite; border-style: dashed; }

      /* --- CONVERSATION AREA --- */
      .conversation-area {
        width: 100%;
        max-width: 600px;
        height: 30vh; /* Fixed height for chat */
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        margin-bottom: 20px;
        position: relative;
        z-index: 5;
      }

      .chat-log {
        flex: 1;
        overflow-y: auto;
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        mask-image: linear-gradient(to bottom, transparent, black 10%);
        -webkit-mask-image: linear-gradient(to bottom, transparent, black 10%);
        scrollbar-width: none; /* Firefox */
      }
      .chat-log::-webkit-scrollbar { display: none; }

      .message {
        display: flex;
        flex-direction: column;
        max-width: 85%;
        animation: slideUp 0.3s ease-out;
      }
      .message.user { align-self: flex-end; align-items: flex-end; }
      .message.ai { align-self: flex-start; align-items: flex-start; }

      .bubble {
        padding: 12px 16px;
        border-radius: var(--radius-md);
        font-size: 0.95rem;
        line-height: 1.5;
        position: relative;
      }
      
      .message.user .bubble {
        background: linear-gradient(135deg, var(--secondary), #7000ff);
        color: white;
        border-bottom-right-radius: 4px;
        box-shadow: 0 4px 15px rgba(189, 0, 255, 0.3);
      }
      
      .message.ai .bubble {
        background: var(--bg-surface);
        border: 1px solid var(--border-glass);
        color: #e0e0e0;
        border-bottom-left-radius: 4px;
        backdrop-filter: blur(12px);
      }

      .meta {
        font-size: 0.7rem;
        color: rgba(255,255,255,0.4);
        margin-top: 4px;
        margin-left: 4px;
      }

      /* --- CONTROLS --- */
      .controls-area {
        width: 100%;
        max-width: 600px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
        z-index: 10;
        padding-bottom: 20px;
      }

      .action-btn {
        background: none;
        border: none;
        color: rgba(255,255,255,0.6);
        cursor: pointer;
        transition: color 0.2s;
        padding: 10px;
      }
      .action-btn:hover { color: white; }

      /* Main Mic Button */
      .mic-btn-wrapper {
        position: relative;
        width: 80px;
        height: 80px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .mic-btn {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: white;
        font-size: 1.5rem;
        cursor: pointer;
        backdrop-filter: blur(10px);
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        z-index: 2;
      }

      .mic-btn:active, .mic-btn.active {
        transform: scale(0.95);
        background: var(--primary);
        color: #000;
        box-shadow: 0 0 30px var(--primary);
        border-color: transparent;
      }

      /* Ripple Effect */
      .ripple {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        width: 100%; height: 100%;
        border-radius: 50%;
        border: 1px solid var(--primary);
        opacity: 0;
        z-index: 1;
      }
      
      .mic-btn.active .ripple {
        animation: rippleEffect 2s infinite;
      }

      /* --- COMMAND BAR (Shortcuts) --- */
      .quick-actions {
        position: absolute;
        bottom: 100px;
        display: flex;
        gap: 10px;
        opacity: 0.6;
        transition: opacity 0.3s;
      }
      .quick-actions:hover { opacity: 1; }
      
      .chip {
        background: rgba(0,0,0,0.4);
        border: 1px solid var(--border-glass);
        padding: 6px 12px;
        border-radius: var(--radius-pill);
        font-size: 0.75rem;
        color: rgba(255,255,255,0.8);
        cursor: pointer;
        backdrop-filter: blur(4px);
        transition: all 0.2s;
      }
      .chip:hover {
        background: rgba(255,255,255,0.1);
        color: white;
        border-color: rgba(255,255,255,0.3);
      }

      /* --- ANIMATIONS --- */
      @keyframes spin { 100% { transform: translate(-50%, -50%) rotate(360deg); } }
      @keyframes spin-rev { 100% { transform: translate(-50%, -50%) rotate(-360deg); } }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
      @keyframes rippleEffect {
        0% { width: 100%; height: 100%; opacity: 0.8; }
        100% { width: 200%; height: 200%; opacity: 0; }
      }
      @keyframes slideUp {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* Mobile Adjustments */
      @media (max-width: 600px) {
        .orb-container { width: 120px; height: 120px; margin-bottom: 20px; }
        .orb { width: 60px; height: 60px; }
        .ring-1 { width: 90px; height: 90px; }
        .ring-2 { width: 140px; height: 140px; }
        .quick-actions { bottom: 90px; flex-wrap: wrap; justify-content: center; width: 90%; }
      }
    </style>
  </head>
  <body>

    <!-- Header -->
    <header>
      <div class="brand">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a10 10 0 1 0 10 10H12V2z"></path>
          <path d="M12 2a10 10 0 0 1 10 10h-10z" opacity="0.5"></path>
          <circle cx="12" cy="12" r="3" fill="currentColor"></circle>
        </svg>
        LAMA AI PRO
      </div>
      <div class="status-pill">
        <div class="status-dot" id="status-dot"></div>
        <span id="status-text">Ready</span>
      </div>
    </header>

    <!-- Main Interface -->
    <main>
      <!-- AI Visualizer -->
      <div class="orb-container">
        <div class="ring ring-1"></div>
        <div class="ring ring-2"></div>
        <div class="orb" id="orb"></div>
      </div>

      <!-- Quick Actions (Hints) -->
      <div class="quick-actions">
        <button class="chip" onclick="app.processText('Hello LAMA')">"Hello LAMA"</button>
        <button class="chip" onclick="app.processText('What is the time?')">"Time"</button>
        <button class="chip" onclick="app.processText('Open YouTube')">"Open YouTube"</button>
        <button class="chip" onclick="app.processText('Tell me a joke')">"Tell a joke"</button>
      </div>

      <!-- Chat Area -->
      <div class="conversation-area">
        <div class="chat-log" id="chat-log">
          <!-- Messages go here -->
          <div class="message ai">
            <div class="bubble">Hello! I am LAMA. Hold the microphone button to speak.</div>
            <div class="meta">Just now</div>
          </div>
        </div>
      </div>

      <!-- Controls -->
      <div class="controls-area">
        <button class="action-btn" id="stop-btn" title="Stop Speech">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="4" y="4" width="16" height="16" rx="2"></rect>
          </svg>
        </button>

        <div class="mic-btn-wrapper">
          <div class="ripple"></div>
          <button class="mic-btn" id="mic-btn" aria-label="Hold to talk">
            <svg id="mic-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
              <line x1="12" y1="19" x2="12" y2="23"></line>
              <line x1="8" y1="23" x2="16" y2="23"></line>
            </svg>
          </button>
        </div>

        <button class="action-btn" onclick="app.clearChat()" title="Clear Chat">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
        </button>
      </div>
    </main>

    <script>
      /**
       * LAMA AI CORE LOGIC
       * Handles Speech Recognition, Speech Synthesis, and Command Processing.
       */
      class LamaAI {
        constructor() {
          // DOM Elements
          this.micBtn = document.getElementById('mic-btn');
          this.stopBtn = document.getElementById('stop-btn');
          this.orb = document.getElementById('orb');
          this.chatLog = document.getElementById('chat-log');
          this.statusText = document.getElementById('status-text');
          this.statusDot = document.getElementById('status-dot');
          
          // State
          this.isListening = false;
          this.synth = window.speechSynthesis;
          this.recognition = null;
          this.audioContext = null;
          this.analyser = null;
          this.dataArray = null;
          this.source = null;
          this.animationId = null;

          // Initialize
          this.initSpeechRecognition();
          this.bindEvents();
        }

        // --- SPEECH RECOGNITION SETUP ---
        initSpeechRecognition() {
          const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
          if (SpeechRecognition) {
            this.recognition = new SpeechRecognition();
            this.recognition.continuous = false; // Stop after one sentence
            this.recognition.lang = 'en-US';
            this.recognition.interimResults = false;

            this.recognition.onstart = () => {
              this.isListening = true;
              this.setUIState('listening');
              this.initAudioVisualizer(); // Start the visualizer
            };

            this.recognition.onend = () => {
              this.isListening = false;
              this.micBtn.classList.remove('active');
              if (this.statusText.innerText === 'Listening...') {
                this.setUIState('ready');
              }
              this.stopAudioVisualizer();
            };

            this.recognition.onresult = (event) => {
              const transcript = event.results[0][0].transcript;
              this.addMessage('user', transcript);
              this.processCommand(transcript);
            };

            this.recognition.onerror = (event) => {
              console.error("Speech Error:", event.error);
              this.isListening = false;
              this.micBtn.classList.remove('active');
              this.setUIState('ready');
              if (event.error === 'not-allowed') {
                this.speak("Microphone access denied. Please check permissions.");
                this.addMessage('ai', "Error: Microphone access denied.");
              }
            };
          } else {
            this.addMessage('ai', "Sorry, your browser does not support Web Speech API. Try Chrome.");
          }
        }

        // --- AUDIO VISUALIZATION (Makes it feel "Alive") ---
        async initAudioVisualizer() {
          try {
            if (!this.audioContext) {
              this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (this.audioContext.state === 'suspended') {
              await this.audioContext.resume();
            }

            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            this.source = this.audioContext.createMediaStreamSource(stream);
            this.analyser = this.audioContext.createAnalyser();
            this.analyser.fftSize = 64; // Low res for performance
            this.source.connect(this.analyser);
            this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);
            
            this.visualize();
          } catch (e) {
            console.warn("Visualizer init failed (mic permission likely pending):", e);
          }
        }

        visualize() {
          if (!this.isListening) return;
          this.animationId = requestAnimationFrame(() => this.visualize());
          this.analyser.getByteFrequencyData(this.dataArray);

          // Calculate average volume
          let sum = 0;
          for(let i = 0; i < this.dataArray.length; i++) sum += this.dataArray[i];
          const average = sum / this.dataArray.length;

          // Scale Orb based on volume
          const scale = 1 + (average / 256) * 0.8; // Max scale 1.8
          this.orb.style.transform = `scale(${scale})`;
          this.orb.style.boxShadow = `0 0 ${40 + average}px var(--primary)`;
        }

        stopAudioVisualizer() {
          if (this.animationId) cancelAnimationFrame(this.animationId);
          this.orb.style.transform = 'scale(1)';
          this.orb.style.boxShadow = '0 0 40px var(--primary-dim)';
          // Note: We keep stream open for responsiveness, or close if needed.
        }

        // --- UI & EVENTS ---
        bindEvents() {
          // Mouse/Touch events for Hold-to-Talk
          const startListen = (e) => {
            e.preventDefault();
            if (!this.recognition) return;
            try { this.recognition.start(); } catch(err) {}
          };
          const stopListen = (e) => {
            e.preventDefault();
            if (this.recognition && this.isListening) {
              this.recognition.stop();
            }
          };

          this.micBtn.addEventListener('mousedown', startListen);
          this.micBtn.addEventListener('mouseup', stopListen);
          this.micBtn.addEventListener('mouseleave', stopListen);
          this.micBtn.addEventListener('touchstart', startListen);
          this.micBtn.addEventListener('touchend', stopListen);

          // Stop Button
          this.stopBtn.addEventListener('click', () => {
            this.synth.cancel();
            if(this.recognition) this.recognition.stop();
            this.setUIState('ready');
          });
        }

        setUIState(state) {
          this.statusDot.className = 'status-dot'; // reset
          if (state === 'listening') {
            this.statusText.innerText = "Listening...";
            this.statusDot.classList.add('listening');
            this.micBtn.classList.add('active');
          } else if (state === 'processing') {
            this.statusText.innerText = "Thinking...";
            this.statusDot.classList.add('processing');
          } else if (state === 'speaking') {
            this.statusText.innerText = "Speaking...";
            this.statusDot.style.backgroundColor = 'var(--secondary)';
          } else {
            this.statusText.innerText = "Ready";
            this.statusDot.style.backgroundColor = 'var(--success)';
          }
        }

        // --- CONVERSATION LOGIC ---
        addMessage(role, text) {
          const div = document.createElement('div');
          div.className = `message ${role}`;
          const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          
          div.innerHTML = `
            <div class="bubble">${text}</div>
            <div class="meta">${time}</div>
          `;
          this.chatLog.appendChild(div);
          this.chatLog.scrollTop = this.chatLog.scrollHeight;
        }

        clearChat() {
          this.chatLog.innerHTML = '';
        }

        speak(text) {
          if (!this.synth) return;
          this.synth.cancel(); // Stop previous
          this.setUIState('speaking');

          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'en-US';
          utterance.rate = 1.05; // Slightly faster feels more "AI"
          utterance.pitch = 1;

          // Try to find a good voice (Google US English or Microsoft Zira usually sound good)
          const voices = this.synth.getVoices();
          const preferredVoice = voices.find(v => v.name.includes("Google US English")) || voices[0];
          if (preferredVoice) utterance.voice = preferredVoice;

          utterance.onend = () => {
            this.setUIState('ready');
          };

          this.synth.speak(utterance);
        }

        // --- THE BRAIN: COMMAND PROCESSING ---
        processCommand(rawText) {
          const text = rawText.toLowerCase().trim();
          this.setUIState('processing');

          // 1. GREETINGS
          if (text.match(/^(hello|hi|hey|greetings|namaste)/)) {
            const replies = [
              "Hello! I am ready to help.",
              "Hi there! What can I do for you?",
              "Namaste! I am listening.",
              "Hello. How are you doing today?"
            ];
            const reply = replies[Math.floor(Math.random() * replies.length)];
            this.reply(reply);
            return;
          }

          // 2. TIME & DATE
          if (text.includes("time")) {
            const timeStr = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            this.reply(`The current time is ${timeStr}`);
            return;
          }
          if (text.includes("date") || text.includes("day is it")) {
            const dateStr = new Date().toLocaleDateString([], {weekday: 'long', month: 'long', day: 'numeric'});
            this.reply(`Today is ${dateStr}`);
            return;
          }

          // 3. OPEN APPS
          if (text.startsWith("open")) {
            const site = text.replace("open", "").trim();
            this.handleOpenApp(site);
            return;
          }

          // 4. SEARCH
          if (text.includes("search for") || text.includes("who is") || text.includes("what is")) {
            const query = text.replace("search for", "").replace("who is", "").replace("what is", "").trim();
            this.handleSearch(query);
            return;
          }
          
          // 5. WHATSAPP
          if (text.includes("whatsapp")) {
            this.handleWhatsApp(text);
            return;
          }

          // 6. FUN / JOKES
          if (text.includes("joke")) {
            const jokes = [
              "Why did the AI go to therapy? It had too many deep learning issues.",
              "I told my computer I needed a break, and now it won't stop sending me Kit-Kats.",
              "Why do programmers prefer dark mode? Because light attracts bugs."
            ];
            this.reply(jokes[Math.floor(Math.random() * jokes.length)]);
            return;
          }

          // Fallback
          this.reply(`I'm not sure how to handle "${rawText}" yet, but I'm learning. Try asking me to open YouTube or search the web.`);
        }

        // Helper to reply (speak + text)
        reply(text) {
          this.addMessage('ai', text);
          this.speak(text);
        }

        // Action Handlers
        handleOpenApp(appName) {
          const urlMap = {
            'youtube': 'https://youtube.com',
            'gmail': 'https://mail.google.com',
            'google': 'https://google.com',
            'facebook': 'https://facebook.com',
            'twitter': 'https://twitter.com',
            'instagram': 'https://instagram.com'
          };

          let url = null;
          // Fuzzy match
          for (const key in urlMap) {
            if (appName.includes(key)) {
              url = urlMap[key];
              break;
            }
          }

          if (url) {
            window.open(url, '_blank');
            this.reply(`Opening ${appName} now.`);
          } else {
            this.reply(`I don't have a direct link for ${appName}, but I can search for it.`);
            this.handleSearch(appName);
          }
        }

        handleSearch(query) {
          const url = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
          window.open(url, '_blank');
          this.reply(`Here is what I found for ${query}.`);
        }

        handleWhatsApp(text) {
          // Extract message after "saying"
          const sayingIndex = text.indexOf("saying");
          let msg = "";
          if (sayingIndex > -1) {
            msg = text.substring(sayingIndex + 6).trim();
          }
          
          const url = `https://wa.me/?text=${encodeURIComponent(msg)}`;
          window.open(url, '_blank');
          this.reply("I've opened WhatsApp with your message. Please select a contact.");
        }

        // External trigger for buttons
        processText(text) {
          this.addMessage('user', text);
          this.processCommand(text);
        }
      }

      // Initialize App
      const app = new LamaAI();

    </script>
  </body>
</html>
