<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lama AI — Voice Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-bg: #050816;
            --color-card: #0b1020;
            --color-text: #e5e7eb;
            --color-accent: #38bdf8;
            --font-sans: "Space Grotesk", sans-serif;
        }

        body {
            margin: 0; min-height: 100vh; font-family: var(--font-sans);
            background-color: var(--color-bg); color: var(--color-text);
            display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle at top right, hsla(199, 100%, 56%, 0.1), transparent),
                        radial-gradient(circle at bottom left, hsla(280, 100%, 63%, 0.1), transparent);
        }

        .container { width: 90%; max-width: 500px; text-align: center; }

        .orb-container {
            position: relative; width: 150px; height: 150px; margin: 0 auto 30px;
        }

        .orb {
            width: 100%; height: 100%; border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #fff, var(--color-accent) 40%, #000 100%);
            box-shadow: 0 0 40px rgba(56, 189, 248, 0.4);
            transition: all 0.3s ease;
        }

        /* Animations */
        .listening { animation: pulse 1.2s infinite; box-shadow: 0 0 60px #38bdf8; }
        .thinking { animation: spin 2s linear infinite; filter: hue-rotate(90deg); }
        .speaking { animation: bounce 0.6s infinite; filter: hue-rotate(280deg); }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        .chat-box {
            background: var(--color-card); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px; padding: 20px; height: 250px; overflow-y: auto;
            margin-bottom: 20px; text-align: left; font-size: 14px;
        }

        .msg { margin-bottom: 10px; line-height: 1.4; padding: 8px 12px; border-radius: 10px; max-width: 80%; }
        .user { background: rgba(56, 189, 248, 0.1); align-self: flex-end; margin-left: auto; border: 1px solid var(--color-accent); }
        .ai { background: #1e293b; border: 1px solid #334155; }

        .controls button {
            background: var(--color-accent); border: none; padding: 12px 24px;
            border-radius: 30px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .controls button:hover { transform: scale(1.05); opacity: 0.9; }
    </style>
</head>
<body>

<div class="container">
    <h1 style="margin-bottom: 5px;">Lama AI</h1>
    <p id="status" style="font-size: 13px; color: #9ca3af; margin-bottom: 25px;">Ready to help</p>

    <div class="orb-container">
        <div class="orb" id="orb"></div>
    </div>

    <div class="chat-box" id="chat">
        <div class="msg ai">Hello! I'm Lama. Click the button and say "Hello Lama" to wake me up.</div>
    </div>

    <div class="controls">
        <button id="micBtn">Start Assistant</button>
    </div>
</div>

<script>
    // YOUR CONFIGURATION
    const API_KEY = "AIzaSyB8gu84eP4Bli3P4OcXqjBRAJFrZQSezAU";
    
    // State
    let isListening = false;
    const history = [
        { role: "user", parts: [{ text: "You are Lama, a voice assistant. Keep answers under 30 words and don't use bold or bullet points." }]},
        { role: "model", parts: [{ text: "Understood. I'll keep it brief." }]}
    ];

    // Elements
    const orb = document.getElementById('orb');
    const chat = document.getElementById('chat');
    const status = document.getElementById('status');
    const micBtn = document.getElementById('micBtn');

    // Speech API
    const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.continuous = true;
    recognition.lang = 'en-US';

    function addMessage(role, text) {
        const div = document.createElement('div');
        div.className = `msg ${role}`;
        div.innerText = text;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    async function callGemini(prompt) {
        orb.className = "orb thinking";
        status.innerText = "Thinking...";
        history.push({ role: "user", parts: [{ text: prompt }] });

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: history })
            });
            const data = await response.json();
            const reply = data.candidates[0].content.parts[0].text;
            history.push({ role: "model", parts: [{ text: reply }] });
            return reply;
        } catch (e) {
            console.error(e);
            return "Sorry, I had trouble connecting. Check the console.";
        }
    }

    function speak(text) {
        const synth = window.speechSynthesis;
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.onstart = () => { orb.className = "orb speaking"; status.innerText = "Speaking..."; };
        utterance.onend = () => { orb.className = "orb"; status.innerText = "Waiting for 'Hello Lama'..."; };
        synth.speak(utterance);
    }

    recognition.onresult = async (event) => {
        const transcript = event.results[event.results.length - 1][0].transcript.trim().toLowerCase();
        
        // Wake Word Logic
        if (transcript.includes("hello lama") || transcript.includes("hey lama")) {
            speak("Yes? I am listening.");
            isListening = true;
            status.innerText = "Listening...";
            orb.className = "orb listening";
        } 
        else if (isListening) {
            addMessage('user', transcript);
            isListening = false; // Reset to wait for next command
            const aiReply = await callGemini(transcript);
            addMessage('ai', aiReply);
            speak(aiReply);
        }
    };

    micBtn.onclick = () => {
        recognition.start();
        micBtn.innerText = "Microphone Active";
        micBtn.style.background = "#22c55e";
        status.innerText = "Say 'Hello Lama'";
    };
</script>

</body>
</html>
